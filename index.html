  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root { --sky: #38bdf8; --amber: #f59e0b; --navy: #0b1220; --deep: #020617; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--deep); color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
    h1, h2, h3, h4, .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .yuma-title { background: linear-gradient(135deg, #ffffff 0%, #7dd3fc 35%, #38bdf8 55%, #1d4ed8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.35)); letter-spacing: -0.04em; }
    .glass-card { background: linear-gradient(145deg, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.55)); border: 1px solid rgba(56, 189, 248, 0.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04); transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease; }
    .glass-card:hover { border-color: rgba(245, 158, 11, 0.45); box-shadow: 0 12px 40px rgba(245, 158, 11, 0.12), 0 8px 32px rgba(0, 0, 0, 0.5); transform: translateY(-3px); }
    .wave-bg { background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.12), transparent), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(245, 158, 11, 0.06), transparent); }
    .timeline-line { position: relative; }
    .timeline-line::before { content: ''; position: absolute; top: 28px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), rgba(245, 158, 11, 0.4), rgba(56, 189, 248, 0.3), transparent); z-index: 0; }
    .avatar-ring { box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25), 0 0 20px rgba(56, 189, 248, 0.15); }
    .nav-scrolled { background: rgba(2, 6, 23, 0.85) !important; border-bottom-color: rgba(56, 189, 248, 0.15) !important; }
    #mobileMenu { transition: max-height 0.35s ease, opacity 0.3s ease; max-height: 0; opacity: 0; overflow: hidden; }
    #mobileMenu.open { max-height: 360px; opacity: 1; }
    input:focus, textarea:focus { outline: none; border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.7s ease both; }
    .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; }
    .jubilee-badge { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.08)); border: 1px solid rgba(245, 158, 11, 0.35); }
    .section-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.2), transparent); }
    .auth-input { width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 0.75rem; padding: 0.75rem 1rem; color: white; font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s; }
    .auth-input:focus { border-color: rgba(56, 189, 248, 0.55); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12); }
    .btn-primary { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 800; border-radius: 0.75rem; padding: 0.75rem 1.25rem; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; transition: filter 0.2s, transform 0.15s; cursor: pointer; border: none; }
    .btn-primary:hover { filter: brightness(1.1); } .btn-primary:active { transform: scale(0.98); } .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; filter: none; }
    .btn-secondary { background: rgba(56, 189, 248, 0.12); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 700; border-radius: 0.75rem; padding: 0.65rem 1.1rem; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; transition: background 0.2s; cursor: pointer; }
    .btn-secondary:hover { background: rgba(56, 189, 248, 0.22); }
    .user-chip { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 9999px; padding: 0.25rem 0.75rem; font-size: 0.75rem; color: #7dd3fc; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
