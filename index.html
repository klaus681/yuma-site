<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUMA Team | 25 Anni in Rotta Insieme</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #94a3b8;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <p id="boot">Caricamento YUMA Team…</p>
  <script>
  (function () {
    var GOOD = 'https://cdn.jsdelivr.net/gh/klaus681/yuma-site@e510633a9f9bf0c7821e1ddf3368c2e18b06a18a/';
    fetch(GOOD + 'index.html')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        // Usa i18n e app locali (app.js carica il core + regolamento-addon)
        html = html.replace(
          /<script\s+src=["']i18n\.js["']><\/script>\s*<script\s+src=["']app\.js["']><\/script>/i,
          '<script src="i18n.js"></script>\n<script src="app.js"></script>'
        );
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (err) {
        var el = document.getElementById('boot');
        if (el) el.textContent = 'Errore di caricamento: ' + err.message;
        console.error(err);
      });
  })();
  </script>
</body>
</html>
