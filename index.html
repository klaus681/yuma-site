<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUMA Team | 25 Anni in Rotta Insieme</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #020617;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #boot {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>
  <p id="boot">Caricamento YUMA Team…</p>
  <script>
  (function () {
    var url = 'https://cdn.jsdelivr.net/gh/klaus681/yuma-site@e510633a9f9bf0c7821e1ddf3368c2e18b06a18a/index.html';
    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (html) {
        // Sostituisci gli script locali con i nostri (i18n + app che carica addon Regolamento)
        html = html.replace(
          /<script\s+src=["']i18n\.js["']><\/script>/i,
          '<script src="i18n.js"><\/script>'
        );
        html = html.replace(
          /<script\s+src=["']app\.js["']><\/script>/i,
          '<script src="app.js"><\/script>'
        );
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (err) {
        var el = document.getElementById('boot');
        if (el) el.textContent = 'Errore di caricamento: ' + (err && err.message ? err.message : err);
        console.error(err);
      });
  })();
  </script>
</body>
</html>
